name: pos_cafe_mobile
description: Aplikasi Kasir Ruang Senyawa POS (Local-First Android & Tablet)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  google_sign_in: ^6.2.1
  googleapis: ^11.4.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.1.0
  print_bluetooth_thermal: ^1.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/seed.raw.json
    - assets/seed/logo.jpg
