name: Build & Release APK

# Trigger: tiap push ke main, atau manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      - name: Verifikasi kode (analyze)
        run: flutter analyze --no-pub
        continue-on-error: true # info/lint kosmetik jangan gagalkan build

      # === SIGNING ===
      # Kalau secret KEYSTORE_BASE64 & KEYSTORE_PASSWORD ada -> pakai keystore release
      # (SHA-1 konsisten = OAuth Google jalan).
      - name: Decode keystore release (dari Secret)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ruang_senyawa.jks
          echo "Keystore release dipasang dari Secret."

      - name: Tulis key.properties (dari Secret)
        if: ${{ env.KEYSTORE_PASSWORD != '' }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=ruang_senyawa.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "ruangsenyawa" > android/key.properties
          echo "key.properties ditulis."

      - name: Build APK release
        run: flutter build apk --release

      # === UPLOAD ARTIFACT ===
      # Artifact = download manual dari tab Actions (retensi 90 hari).
      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruang-senyawa-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      # === GITHUB RELEASE ===
      # Auto-create Release tiap push ke main, biar tester download dari halaman Releases.
      - name: Buat GitHub Release dengan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ruang Senyawa POS v1.0.${{ github.run_number }}
          body: |
            ### 📱 Ruang Senyawa POS - Release Build #${{ github.run_number }}
            Otomatis di-build dari commit `${{ github.sha }}`.

            #### 📥 Cara Install:
            1. Download file **`app-release.apk`** di bawah.
            2. Buka dan instal di HP/Tablet Android (*izinkan Install from unknown apps*).
            3. Buka aplikasi dan lakukan Login Google (menggunakan akun owner/tester yang didaftarkan di Google Cloud).

            #### 📋 Fitur yang disertakan:
            - Local-first POS (Katalog lengkap, Resep BOM inline, Varian).
            - Realtime stock validation & portion estimate.
            - Validasi voucher, kas masuk/keluar, dan rekap laci harian.
            - Auto-sync Google Sheet (Dashboard Live KPI, Rekap Bulanan, Matriks Absensi).
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

