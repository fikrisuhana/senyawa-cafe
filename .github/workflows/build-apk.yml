name: Build & Release APK

# Trigger: tiap push ke main, atau manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      - name: Verifikasi kode (analyze)
        run: flutter analyze --no-pub
        continue-on-error: true # info/lint cosmetik jangan gagalkan build

      # === SIGNING ===
      # Kalau secret KEYSTORE_BASE64 & KEYSTORE_PASSWORD ada → pakai keystore release
      # (SHA-1 konsisten = OAuth jalan). Kalau ga ada → fallback ke debug keystore.
      - name: Decode keystore release (dari Secret)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ruang_senyawa.jks
          echo "Keystore release dipasang dari Secret."
        working-directory: ${{ github.workspace }}

      - name: Tulis key.properties (dari Secret)
        if: ${{ env.STORE_PASSWORD != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=ruang_senyawa.jks\n' \
            "$STORE_PASSWORD" "$STORE_PASSWORD" "ruangsenyawa" > android/key.properties
          echo "key.properties ditulis."

      - name: Build APK release
        run: flutter build apk --release

      # === UPLOAD ARTIFACT ===
      # Artifact = download manual dari tab Actions (retensi 90 hari).
      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruang-senyawa-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      # === GITHUB RELEASE ===
      # Auto-create Release tiap push ke main, biar tester download dari halaman Releases.
      - name: Buat GitHub Release dengan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            APK otomatis dari commit `${{ github.sha }}`.

            ## Cara install
            1. Download file `app-release.apk` di bawah.
            2. Buka di HP Android (izinkan install dari sumber tidak dikenal).
            3. Login Google pakai email yg sudah didaftarkan owner di Google Cloud (Test users).

            ## Catatan
            - Ini build **release** dengan keystore resmi → login Google jalan jika email tester terdaftar.
            - Tabak spreadsheet: Dashboard, Rekap_Bulanan, Absensi_Matriks, dll auto-generate saat login.
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
